[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wikipedia-translation-toolkit"
version = "1.2.0"
description = "Bengali Wikipedia translation tools for Chinese, Japanese, Russian, German and English content"
readme = "README.md"
authors = [
    {name = "Wikipedia Translation Team"}
]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pypinyin>=0.50.0",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/joysriramsarkar/wikipedia-bangla-translation-tool"

[tool.vercel]
entrypoint = "app:app"

[tool.setuptools]
py-modules = ["wikipedia_translation_toolkit"]

[tool.setuptools.packages.find]
include = ["common*", "cx_postprocess*", "*-বাংলা অনুবাদ*"]
exclude = ["__pycache__", "*.egg-info"]

[tool.pyright]
extraPaths = [
    ".",
    "common",
    "scripts",
    "চীনা-বাংলা অনুবাদ",
    "জাপানি-বাংলা অনুবাদ",
    "রুশ-বাংলা অনুবাদ",
    "জার্মান-বাংলা অনুবাদ",
    "ইংরেজি-বাংলা অনুবাদ",
    "cx_postprocess",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    ".",
    "common",
    "scripts",
    "চীনা-বাংলা অনুবাদ",
    "জাপানি-বাংলা অনুবাদ",
    "রুশ-বাংলা অনুবাদ",
    "জার্মান-বাংলা অনুবাদ",
    "ইংরেজি-বাংলা অনুবাদ",
    "cx_postprocess",
]

